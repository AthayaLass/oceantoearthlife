<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner - Ocean to Earth Life</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header with logo and navigation -->
  <header class="py-3 bg-white shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light container-fluid px-3">
      <a href="home.html" class="logo-link d-flex align-items-center me-3">
        <img src="../assets/logo.png" alt="Ocean to Earth Life Logo" class="logo img-fluid" style="width: 138px; height: 138px;" srcset="../assets/logo.png 1x, ../assets/logo.png 2x">
      </a>
      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
        <ul class="navbar-nav mb-2 mb-lg-0 flex-wrap">
          <li class="nav-item"><a href="home.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link"><i class="fas fa-users"></i> Chi Siamo</a></li>
          <li class="nav-item"><a href="vision.html" class="nav-link"><i class="fas fa-seedling"></i> Visione & Progetti</a></li>
          <li class="nav-item"><a href="blog.html" class="nav-link"><i class="fas fa-blog"></i> Blog</a></li>
          <li class="nav-item"><a href="partners.html" class="nav-link"><i class="fas fa-handshake"></i> Partner</a></li>
          <li class="nav-item"><a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i> Contatti & Collaborazione</a></li>
          <li class="nav-item"><a href="social.html" class="nav-link"><i class="fas fa-hashtag"></i> Post Sociali</a></li>
        </ul>
        <!-- Language Selector -->
        <div class="language-selector ms-3">
          <select class="form-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it" selected>Italiano</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    <h1>I Nostri Partner</h1>
    <div class="row g-4 justify-content-center">
      <div class="col-12">
        <section class="about-card">
          <div class="card-content">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
              <div class="col">
                <div class="partner-card text-center">
                  <a href="mailto:veronica@oceantoearth.life" class="partner-link">
                    <img src="../assets/Logo_Veranaturae.png" alt="Logo Veranaturae" class="img-fluid">
                    <h3>Veranaturae</h3>
                  </a>
                </div>
              </div>
              <div class="col">
                <div class="partner-card text-center">
                  <a href="mailto:antoine@oceantoearth.life" class="partner-link">
                    <img src="../assets/Logo_Athelas.png" alt="Logo Athelas Diving" class="img-fluid">
                    <h3>Athelas Diving</h3>
                  </a>
                </div>
              </div>
              <div class="col">
                <div class="partner-card text-center">
                  <a href="https://www.pianspessa.ch/" target="_blank" rel="noopener noreferrer" class="partner-link">
                    <img src="../assets/fondazionePianspessa_logo.png" alt="Logo Fondazione Pianspessa" class="img-fluid">
                    <h3>Fondazione Pianspessa</h3>
                  </a>
                </div>
              </div>
              <div class="col">
                <div class="partner-card text-center">
                  <a href="https://dreissena.ch/" target="_blank" rel="noopener noreferrer" class="partner-link">
                    <img src="../assets/dreissena_logo.jpg" alt="Logo Dreissena Systems Sàrl" class="img-fluid">
                    <h3>Dreissena Systems Sàrl</h3>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="bg-white text-center py-3 mt-4 shadow-sm">
    &copy; 2025 Ocean to Earth Life. Tutti i diritti riservati.
  </footer>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../js/blog.js"></script>
  <script src="../js/header.js"></script>
  <script>
    function changeLanguage(lang) {
      const currentPath = window.location.pathname;
      const currentPage = currentPath.split('/').pop();
      window.location.href = `/${lang}/${currentPage}`;
    }
  </script>
</body>
</html>
